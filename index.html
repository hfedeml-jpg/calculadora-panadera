<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Panadería Pro</title>
    <style>
        :root {
            --primary: #f59e0b;
            --primary-dark: #d97706;
            --bg: #111827;
            --card-bg: #1f2937;
            --text: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #374151;
            --input-bg: #111827;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        h1 {
            font-size: 1.5rem;
            text-align: center;
            color: var(--primary);
            margin-bottom: 20px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-muted);
        }
        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid var(--border);
            background-color: var(--input-bg);
            color: var(--text);
            border-radius: 8px;
            font-size: 1rem;
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
        }
        .btn {
            background-color: var(--primary);
            color: #111827;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn:active {
            background-color: var(--primary-dark);
        }
        .btn-small {
            padding: 6px 10px;
            font-size: 0.85rem;
            width: auto;
            margin-top: 4px;
        }
        .btn-danger { background-color: #ef4444; color: white; padding: 6px 10px; font-size: 0.8rem; border-radius: 4px; border: none; cursor: pointer;}
        .btn-success { background-color: #10b981; color: white; }
        
        .section-title {
            font-size: 1.1rem;
            color: var(--primary);
            margin-top: 0;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .grid-header {
            display: grid;
            grid-template-columns: 24px 65px 1fr 80px 40px;
            gap: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-align: center;
            align-items: center;
        }
        .grid-header .col-name { text-align: left; padding-left: 4px; }

        .row-item {
            display: grid;
            grid-template-columns: 24px 65px 1fr 80px 40px;
            gap: 4px;
            margin-bottom: 8px;
            align-items: center;
            background: rgba(255,255,255,0.02);
            padding: 4px 0;
            border-radius: 6px;
            touch-action: none; /* Crucial para que el gesto táctil arrastre bien en iPhone */
        }
        .row-item.dragging {
            opacity: 0.4;
            background: var(--primary-dark);
        }

        .drag-handle {
            color: var(--text-muted);
            font-size: 1.1rem;
            text-align: center;
            cursor: grab;
            user-select: none;
        }
        .drag-handle:active {
            cursor: grabbing;
        }

        .row-item input {
            text-align: center;
            padding: 8px 4px;
        }
        .row-item input.input-name {
            text-align: left;
        }

        .recipe-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid var(--border);
        }
        .recipe-item:last-child {
            border-bottom: none;
        }
        .recipe-actions button {
            padding: 6px 10px;
            font-size: 0.8rem;
            margin-left: 4px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
        }
        .btn-load { background-color: #10b981; color: white; }
        .btn-delete { background-color: #ef4444; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h1>Calculadora Panadera 🥖</h1>

    <!-- Control de Peso Total -->
    <div class="card">
        <div class="form-group">
            <label>Peso Total Deseado de la Masa (g)</label>
            <input type="number" id="pesoTotalInput" step="any" oninput="calcularDesdePesoTotal()">
        </div>
    </div>

    <!-- SECCIÓN HARINAS -->
    <div class="card">
        <div class="section-title">
            <span>Harinas (% sobre total de harina)</span>
        </div>
        
        <div class="grid-header">
            <div></div>
            <div>%</div>
            <div class="col-name">Tipo de Harina</div>
            <div>Gramos</div>
            <div></div>
        </div>

        <div id="contenedor-harinas" class="sortable-container">
            <!-- Se inyectan por JS -->
        </div>

        <button class="btn btn-small btn-success" onclick="agregarHarina('Harina Integral', 0, 0)">+ Agregar Harina</button>
    </div>

    <!-- SECCIÓN OTROS INGREDIENTES -->
    <div class="card">
        <div class="section-title">
            <span>Otros Ingredientes</span>
        </div>
        
        <div class="grid-header">
            <div></div>
            <div>%</div>
            <div class="col-name">Ingrediente</div>
            <div>Gramos</div>
            <div></div>
        </div>

        <div id="contenedor-ingredientes" class="sortable-container">
            <!-- Se inyectan por JS -->
        </div>

        <button class="btn btn-small btn-success" onclick="agregarIngrediente('Nuevo Ingrediente', 0, 0)">+ Agregar Ingrediente</button>
    </div>

    <!-- Guardar Receta -->
    <div class="card">
        <div class="form-group">
            <label>Nombre de la Receta</label>
            <input type="text" id="nombreReceta" placeholder="Ej: Pan Sourdough / Pizza Blend">
        </div>
        <button class="btn" onclick="guardarReceta()">Guardar Receta en el Celular</button>
    </div>

    <!-- Recetas Guardadas -->
    <div class="card">
        <h3 style="margin-top:0; font-size:1.1rem; color:var(--primary);">Mis Recetas Guardadas</h3>
        <div id="lista-recetas">
            <p style="font-size:0.85rem; color:var(--text-muted);">No hay recetas guardadas aún.</p>
        </div>
    </div>
</div>

<script>
    let harinasDefault = [
        { nombre: "Harina 000", porc: 100, gramos: 1000 }
    ];

    let ingredientesDefault = [
        { nombre: "Agua", porc: 70, gramos: 700 },
        { nombre: "Sal", porc: 2, gramos: 20 },
        { nombre: "Levadura Fresca", porc: 0.5, gramos: 5 }
    ];

    let bloqueandoCalculo = false;

    function inicializar() {
        cargarHarinas(harinasDefault);
        cargarIngredientes(ingredientesDefault);
        recalcularTodo();
        cargarRecetasGuardadas();
    }

    function cargarHarinas(lista) {
        let contenedor = document.getElementById('contenedor-harinas');
        contenedor.innerHTML = '';
        lista.forEach(h => {
            agregarHarina(h.nombre, h.porc, h.gramos);
        });
    }

    function cargarIngredientes(lista) {
        let contenedor = document.getElementById('contenedor-ingredientes');
        contenedor.innerHTML = '';
        lista.forEach(i => {
            agregarIngrediente(i.nombre, i.porc, i.gramos);
        });
    }

    function agregarHarina(nombre = '', porc = '', gramos = '') {
        let contenedor = document.getElementById('contenedor-harinas');
        let div = document.createElement('div');
        div.className = 'row-item harina-row';
        div.innerHTML = `
            <div class="drag-handle" title="Arrastrar para ordenar">☰</div>
            <input type="number" step="any" placeholder="%" value="${porc}" oninput="calcularDesdeHarinas()">
            <input type="text" class="input-name" placeholder="Tipo" value="${nombre}">
            <input type="number" step="any" placeholder="g" value="${gramos}" oninput="calcularDesdeGramosHarina(this)">
            <button class="btn-danger" onclick="this.closest('.row-item').remove(); recalcularTodo();" title="Borrar">✕</button>
        `;
        activarArrastre(div);
        contenedor.appendChild(div);
    }

    function agregarIngrediente(nombre = '', porc = '', gramos = '') {
        let contenedor = document.getElementById('contenedor-ingredientes');
        let div = document.createElement('div');
        div.className = 'row-item ingrediente-row';
        div.innerHTML = `
            <div class="drag-handle" title="Arrastrar para ordenar">☰</div>
            <input type="number" step="any" placeholder="%" value="${porc}" oninput="calcularDesdePorcIngrediente(this)">
            <input type="text" class="input-name" placeholder="Nombre" value="${nombre}">
            <input type="number" step="any" placeholder="g" value="${gramos}" oninput="calcularDesdeGramosIngrediente(this)">
            <button class="btn-danger" onclick="this.closest('.row-item').remove(); recalcularTodo();" title="Borrar">✕</button>
        `;
        activarArrastre(div);
        contenedor.appendChild(div);
    }

    // Lógica liviana de Drag and Drop táctil y de escritorio compatible con iPhone
    function activarArrastre(elemento) {
        let handle = elemento.querySelector('.drag-handle');
        
        handle.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            let contenedor = elemento.parentElement;
            let yInicial = e.clientY;
            let rectOriginal = elemento.getBoundingClientRect();
            
            elemento.classList.add('dragging');
            elemento.style.position = 'relative';
            elemento.style.zIndex = '100';

            function onPointerMove(eMove) {
                let deltaY = eMove.clientY - yInicial;
                elemento.style.transform = `translateY(${deltaY}px)`;

                // Encontrar elemento hermano sobre el cual posicionarse
                let hermanos = [...contenedor.querySelectorAll('.row-item:not(.dragging)')];
                let hermanoDestino = hermanos.reduce((masCercano, hermano) => {
                    let box = hermano.getBoundingClientRect();
                    let offset = eMove.clientY - box.top - box.height / 2;
                    if (offset < 0 && offset > masCercano.offset) {
                        return { offset: offset, element: hermano };
                    } else {
                        return masCercano;
                    }
                }, { offset: -Number.MAX_VALUE, element: null }).element;

                if (hermanoDestino) {
                    if (eMove.clientY < hermanoDestino.getBoundingClientRect().top + hermanoDestino.offsetHeight / 2) {
                        contenedor.insertBefore(elemento, hermanoDestino);
                    } else {
                        contenedor.insertBefore(elemento, hermanoDestino.nextElementSibling);
                    }
                }
            }

            function onPointerUp() {
                window.removeEventListener('pointermove', onPointerMove);
                window.removeEventListener('pointerup', onPointerUp);
                
                elemento.classList.remove('dragging');
                elemento.style.transform = '';
                elemento.style.position = '';
                elemento.style.zIndex = '';
            }

            window.addEventListener('pointermove', onPointerMove);
            window.addEventListener('pointerup', onPointerUp);
        });
    }

    function obtenerTotalHarinaGramos() {
        let total = 0;
        document.querySelectorAll('.harina-row').forEach(fila => {
            total += parseFloat(fila.querySelectorAll('input')[2].value) || 0;
        });
        return total;
    }

    function calcularDesdeHarinas() {
        if(bloqueandoCalculo) return;
        bloqueandoCalculo = true;

        let totalHarinasGramos = obtenerTotalHarinaGramos();
        let pesoTotal = totalHarinasGramos;

        document.querySelectorAll('.ingrediente-row').forEach(fila => {
            let inputs = fila.querySelectorAll('input');
            let porc = parseFloat(inputs[0].value) || 0;
            let gramos = totalHarinasGramos * (porc / 100);
            inputs[2].value = gramos ? gramos.toFixed(1) : '';
            pesoTotal += gramos;
        });

        document.getElementById('pesoTotalInput').value = pesoTotal ? pesoTotal.toFixed(1) : '';
        bloqueandoCalculo = false;
    }

    function calcularDesdeGramosHarina(inputEl) {
        if(bloqueandoCalculo) return;
        calcularDesdeHarinas();
    }

    function calcularDesdePesoTotal() {
        if(bloqueandoCalculo) return;
        bloqueandoCalculo = true;

        let pesoTotalDeseado = parseFloat(document.getElementById('pesoTotalInput').value) || 0;
        
        let sumaPorcHarinas = 0;
        document.querySelectorAll('.harina-row').forEach(f => {
            sumaPorcHarinas += parseFloat(f.querySelectorAll('input')[0].value) || 0;
        });

        let sumaPorcOtros = 0;
        document.querySelectorAll('.ingrediente-row').forEach(f => {
            sumaPorcOtros += parseFloat(f.querySelectorAll('input')[0].value) || 0;
        });

        let divisor = (sumaPorcHarinas + sumaPorcOtros) / 100;
        if(divisor <= 0) {
            bloqueandoCalculo = false;
            return;
        }

        let baseHarinaTotal = pesoTotalDeseado / (1 + (sumaPorcOtros / 100));

        document.querySelectorAll('.harina-row').forEach(f => {
            let inputs = f.querySelectorAll('input');
            let porcHarina = parseFloat(inputs[0].value) || 0;
            let gramosH = baseHarinaTotal * (porcHarina / sumaPorcHarinas || 0);
            inputs[2].value = gramosH ? gramosH.toFixed(1) : '';
        });

        let nuevoTotalHarina = obtenerTotalHarinaGramos();
        document.querySelectorAll('.ingrediente-row').forEach(f => {
            let inputs = f.querySelectorAll('input');
            let porc = parseFloat(inputs[0].value) || 0;
            let gramosI = nuevoTotalHarina * (porc / 100);
            inputs[2].value = gramosI ? gramosI.toFixed(1) : '';
        });

        bloqueandoCalculo = false;
    }

    function calcularDesdePorcIngrediente(inputEl) {
        if(bloqueandoCalculo) return;
        let fila = inputEl.closest('.row-item');
        let inputs = fila.querySelectorAll('input');
        let porc = parseFloat(inputs[0].value) || 0;
        let totalHarina = obtenerTotalHarinaGramos();

        let gramos = totalHarina * (porc / 100);
        inputs[2].value = gramos ? gramos.toFixed(1) : '';
        recalcularTotalMasa();
    }

    function calcularDesdeGramosIngrediente(inputEl) {
        if(bloqueandoCalculo) return;
        let fila = inputEl.closest('.row-item');
        let inputs = fila.querySelectorAll('input');
        let gramos = parseFloat(inputs[2].value) || 0;
        let totalHarina = obtenerTotalHarinaGramos();

        if(totalHarina > 0) {
            let porc = (gramos / totalHarina) * 100;
            inputs[0].value = porc ? porc.toFixed(1) : '';
        }
        recalcularTotalMasa();
    }

    function recalcularTotalMasa() {
        if(bloqueandoCalculo) return;
        bloqueandoCalculo = true;
        let pesoTotal = obtenerTotalHarinaGramos();
        document.querySelectorAll('.ingrediente-row').forEach(f => {
            pesoTotal += parseFloat(f.querySelectorAll('input')[2].value) || 0;
        });
        document.getElementById('pesoTotalInput').value = pesoTotal ? pesoTotal.toFixed(1) : '';
        bloqueandoCalculo = false;
    }

    function recalcularTodo() {
        calcularDesdeHarinas();
    }

    function guardarReceta() {
        let nombre = document.getElementById('nombreReceta').value.trim();
        if(!nombre) {
            alert("Por favor ponle un nombre a la receta.");
            return;
        }

        let harinas = [];
        document.querySelectorAll('.harina-row').forEach(f => {
            let ins = f.querySelectorAll('input');
            harinas.push({ porc: ins[0].value, nombre: ins[1].value, gramos: ins[2].value });
        });

        let ingredientes = [];
        document.querySelectorAll('.ingrediente-row').forEach(f => {
            let ins = f.querySelectorAll('input');
            ingredientes.push({ porc: ins[0].value, nombre: ins[1].value, gramos: ins[2].value });
        });

        let receta = { nombre, harinas, ingredientes };

        let recetas = JSON.parse(localStorage.getItem('mis_recetas_pan_v7') || '[]');
        let index = recetas.findIndex(r => r.nombre === nombre);
        if(index >= 0) {
            recetas[index] = receta;
        } else {
            recetas.push(receta);
        }

        localStorage.setItem('mis_recetas_pan_v7', JSON.stringify(recetas));
        document.getElementById('nombreReceta').value = '';
        cargarRecetasGuardadas();
        alert("¡Receta guardada con éxito!");
    }

    function cargarRecetasGuardadas() {
        let contenedor = document.getElementById('lista-recetas');
        let recetas = JSON.parse(localStorage.getItem('mis_recetas_pan_v7') || '[]');

        if(recetas.length === 0) {
            contenedor.innerHTML = `<p style="font-size:0.85rem; color:var(--text-muted);">No hay recetas guardadas aún.</p>`;
            return;
        }

        let html = '';
        recetas.forEach((r, idx) => {
            html += `
                <div class="recipe-item">
                    <div>
                        <strong>${r.nombre}</strong><br>
                        <small style="color:var(--text-muted);">${r.harinas.length} tipos de harina</small>
                    </div>
                    <div class="recipe-actions">
                        <button class="btn-load" onclick="cargarReceta(${idx})">Cargar</button>
                        <button class="btn-delete" onclick="eliminarReceta(${idx})">🗑️</button>
                    </div>
                </div>
            `;
        });
        contenedor.innerHTML = html;
    }

    function cargarReceta(idx) {
        let recetas = JSON.parse(localStorage.getItem('mis_recetas_pan_v7') || '[]');
        let r = recetas[idx];
        if(r) {
            document.getElementById('nombreReceta').value = r.nombre;
            if(r.harinas) cargarHarinas(r.harinas);
            if(r.ingredientes) cargarIngredientes(r.ingredientes);
            recalcularTodo();
        }
    }

    function eliminarReceta(idx) {
        if(confirm("¿Seguro que querés borrar esta receta?")) {
            let recetas = JSON.parse(localStorage.getItem('mis_recetas_pan_v7') || '[]');
            recetas.splice(idx, 1);
            localStorage.setItem('mis_recetas_pan_v7', JSON.stringify(recetas));
            cargarRecetasGuardadas();
        }
    }

    inicializar();
</script>

</body>
</html>
